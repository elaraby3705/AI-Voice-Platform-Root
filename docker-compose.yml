version: '3.8'

services:
  # ----------------------------------------
  # Service 1: Redis (Message Broker)
  # ----------------------------------------
  redis:
    image: redis:alpine
    container_name: nexus_redis
    networks:
      - ai-voice-network
    restart: always

  # ----------------------------------------
  # Service 2: Core API (Backend)
  # ----------------------------------------
  backend:
    build:
      context: ./services/core-api
      dockerfile: Dockerfile
    container_name: ai_voice_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./services/core-api:/app
    env_file:
      - ./services/core-api/.env
    environment:
      - DB_HOST=ai_voice_db_psql
      - DB_NAME=${DB_NAME:-ai_voice_db}
      - DB_USER=${DB_USER:-ai_voice_user}
      - DB_PASSWORD=${DB_PASSWORD:-ai_voice_password}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    networks:
      - ai-voice-network

  # ----------------------------------------
  # Service 3: Frontend (React / Vite)
  # ----------------------------------------
  frontend:
    build:
      context: ./voice-frontend
      dockerfile: Dockerfile
    container_name: ai_voice_frontend
    volumes:
      - ./voice-frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost/api/v1
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - VITE_WATCH_USEPOLLING=true
    depends_on:
      - backend
    networks:
      - ai-voice-network

  # ----------------------------------------
  # Service 4: Database (PostgreSQL)
  # ----------------------------------------
  db:
    image: postgres:15-alpine
    container_name: ai_voice_db_psql
    volumes:
      - ai-voice-db-data:/var/lib/postgresql/data
    env_file:
      - ./services/core-api/.env
    environment:
      - POSTGRES_DB=${DB_NAME:-ai_voice_db}
      - POSTGRES_USER=${DB_USER:-ai_voice_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-ai_voice_password}
    networks:
      - ai-voice-network

  # ----------------------------------------
  # Service 5: AI Agent (The Brain) 🧠
  # ----------------------------------------
  ai_agent:
    build:
      context: ./services/ai-worker
      dockerfile: Dockerfile
    container_name: ai_voice_agent
    volumes:
      - ./services/ai-worker:/app
    env_file:
      - ./services/ai-worker/.env
    restart: unless-stopped
    networks:
      - ai-voice-network

  # ----------------------------------------
  # Service 6: Real-Time API (FastAPI)
  # ----------------------------------------
  realtime-api:
    build:
      context: ./services/realtime-api
    command: uvicorn main:app --host 0.0.0.0 --port 8002 --reload
    container_name: ai_voice_realtime
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    networks:
      - ai-voice-network

  # ----------------------------------------
  # Service 7: Nginx Gateway (Corrected Indentation)
  # ----------------------------------------
  gateway:
    image: nginx:alpine
    container_name: ai_voice_gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
      - realtime-api
    networks:
      - ai-voice-network

networks:
  ai-voice-network:
    driver: bridge

volumes:
  ai-voice-db-data: