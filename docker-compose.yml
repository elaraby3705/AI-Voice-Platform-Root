version: '3.8'

services:

  # ----------------------------------------
  # Service 1: Redis (Message Broker)
  # ----------------------------------------
  redis:
    image: redis:alpine
    container_name: nexus_redis
    ports:
      - "6379:6379"
    networks:
      - ai-voice-network
    restart: always

  # ----------------------------------------
  # Service 2: Core API (Backend)
  # ----------------------------------------
  backend:
    build:
      context: ./services/core-api
      dockerfile: Dockerfile
    container_name: ai_voice_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./services/core-api:/app
    ports:
      - "8000:8000"
    env_file:
      - ./services/core-api/.env
    environment:
      - DB_HOST=ai_voice_db_psql
      - DB_NAME=${DB_NAME:-ai_voice_db}
      - DB_USER=${DB_USER:-ai_voice_user}
      - DB_PASSWORD=${DB_PASSWORD:-ai_voice_password}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - ai-voice-network

  # ----------------------------------------
  # Service 3: Frontend (React / Vite)
  # ----------------------------------------
  frontend:
    build:
      context: ./voice-frontend
      dockerfile: Dockerfile
    container_name: ai_voice_frontend
    volumes:
      # Mount the entire frontend directory to detect config/package changes
      - ./voice-frontend:/app
      # Protect node_modules to avoid overwriting container dependencies
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
      # Enable polling for hot-reload on Virtual Machines (OSBoxes/Ubuntu)
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - VITE_WATCH_USEPOLLING=true
    depends_on:
      - backend
    networks:
      - ai-voice-network

  # ----------------------------------------
  # Service 4: Database (PostgreSQL)
  # ----------------------------------------
  db:
    image: postgres:15-alpine
    container_name: ai_voice_db_psql
    volumes:
      - ai-voice-db-data:/var/lib/postgresql/data
    env_file:
      - ./services/core-api/.env
    environment:
      - POSTGRES_DB=${DB_NAME:-ai_voice_db}
      - POSTGRES_USER=${DB_USER:-ai_voice_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-ai_voice_password}
    ports:
      - "5432:5432"
    networks:
      - ai-voice-network

  # ----------------------------------------
  # Service 5: AI Agent (The Brain) 🧠
  # ----------------------------------------
  ai_agent:
    build:
      context: ./services/ai-worker
      dockerfile: Dockerfile
    container_name: ai_voice_agent
    volumes:
      - ./services/ai-worker:/app
    env_file:
      - ./services/ai-worker/.env
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - ai-voice-network

  # ----------------------------------------
  # Service 6: Real-Time API (FastAPI)
  # ----------------------------------------
  realtime-api:
    build:
      context: ./services/realtime-api
    command: uvicorn main:app --host 0.0.0.0 --port 8002 --reload
    container_name: ai_voice_realtime
    ports:
      - "8002:8002"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FRONTEND_URL=http://localhost:5173,http://127.0.0.1:5173,http://0.0.0.0:5173
    depends_on:
      - redis
    networks:
      - ai-voice-network

# ----------------------------------------
# Networks & Volumes Definition
# ----------------------------------------
networks:
  ai-voice-network:
    driver: bridge

volumes:
  ai-voice-db-data:
