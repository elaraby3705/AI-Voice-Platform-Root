name: Build and Push Images to GCP Artifact Registry

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PROJECT_ID: k8s-cluster-lunching
  GAR_LOCATION: europe-west4
  REPOSITORY: django-app-repo
  REGISTRY: europe-west4-docker.pkg.dev/k8s-cluster-lunching/django-app-repo

jobs:
  build-and-push:
    name: Build & Push Service Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            "${{ env.GAR_LOCATION }}-docker.pkg.dev" \
            --quiet

      # ---------------------------------------------------------
      # Core API
      # ---------------------------------------------------------

      - name: Build Core API Image
        run: |
          docker build \
            -t "${{ env.REGISTRY }}/core-api:${{ github.sha }}" \
            -t "${{ env.REGISTRY }}/core-api:latest" \
            -f ./services/core-api/Dockerfile \
            ./services/core-api

      - name: Push Core API Image
        run: |
          docker push "${{ env.REGISTRY }}/core-api:${{ github.sha }}"
          docker push "${{ env.REGISTRY }}/core-api:latest"

      # ---------------------------------------------------------
      # Frontend
      # ---------------------------------------------------------

      - name: Build Frontend Image
        run: |
          docker build \
            -t "${{ env.REGISTRY }}/frontend:${{ github.sha }}" \
            -t "${{ env.REGISTRY }}/frontend:latest" \
            -f ./voice-frontend/Dockerfile \
            --build-arg VITE_API_URL=https://elaraby.shop/api/v1 \
            ./voice-frontend

      - name: Push Frontend Image
        run: |
          docker push "${{ env.REGISTRY }}/frontend:${{ github.sha }}"
          docker push "${{ env.REGISTRY }}/frontend:latest"

      # ---------------------------------------------------------
      # AI Worker
      # ---------------------------------------------------------

      - name: Build AI Worker Image
        run: |
          docker build \
            -t "${{ env.REGISTRY }}/ai-worker:${{ github.sha }}" \
            -t "${{ env.REGISTRY }}/ai-worker:latest" \
            -f ./services/ai-worker/Dockerfile \
            ./services/ai-worker

      - name: Push AI Worker Image
        run: |
          docker push "${{ env.REGISTRY }}/ai-worker:${{ github.sha }}"
          docker push "${{ env.REGISTRY }}/ai-worker:latest"

      # ---------------------------------------------------------
      # Realtime API
      # ---------------------------------------------------------

      - name: Build Realtime API Image
        run: |
          docker build \
            -t "${{ env.REGISTRY }}/realtime-api:${{ github.sha }}" \
            -t "${{ env.REGISTRY }}/realtime-api:latest" \
            -f ./services/realtime-api/Dockerfile \
            ./services/realtime-api

      - name: Push Realtime API Image
        run: |
          docker push "${{ env.REGISTRY }}/realtime-api:${{ github.sha }}"
          docker push "${{ env.REGISTRY }}/realtime-api:latest"

      # ---------------------------------------------------------
      # Summary
      # ---------------------------------------------------------

      - name: Pipeline Summary
        run: |
          echo "=============================================="
          echo "✅ Build & Push completed successfully"
          echo "=============================================="
          echo ""
          echo "Project:  ${{ env.PROJECT_ID }}"
          echo "Registry: ${{ env.REGISTRY }}"
          echo "Commit:   ${{ github.sha }}"
          echo ""
          echo "Images:"
          echo "  Core API:"
          echo "    ${{ env.REGISTRY }}/core-api:${{ github.sha }}"
          echo "    ${{ env.REGISTRY }}/core-api:latest"
          echo ""
          echo "  Frontend:"
          echo "    ${{ env.REGISTRY }}/frontend:${{ github.sha }}"
          echo "    ${{ env.REGISTRY }}/frontend:latest"
          echo ""
          echo "  AI Worker:"
          echo "    ${{ env.REGISTRY }}/ai-worker:${{ github.sha }}"
          echo "    ${{ env.REGISTRY }}/ai-worker:latest"
          echo ""
          echo "  Realtime API:"
          echo "    ${{ env.REGISTRY }}/realtime-api:${{ github.sha }}"
          echo "    ${{ env.REGISTRY }}/realtime-api:latest"
          echo ""
          echo "=============================================="
