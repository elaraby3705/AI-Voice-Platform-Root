name: Build and Push Images to GCP Artifact Registry

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: "k8s-cluster-lunching"
  GAR_LOCATION: "europe-west4"
  REPOSITORY: "django-app-repo"

jobs:
  build-and-push:
    name: Build & Push Service Images
    runs-on: ubuntu-latest

    steps:
    # 1. سحب الكود من GitHub
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. تسجيل الدخول لـ GCP عبر مفتاح Service Account
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker for GCP Artifact Registry
      run: |
        gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

    # 3. بناء ورفع الصور مع وسوم Commit و Latest
    - name: Build and Push Images
      run: |
        REGISTRY="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}"

        # 1. Core API
        docker build -t $REGISTRY/core-api:${{ github.sha }} -t $REGISTRY/core-api:latest ./services/core-api
        docker push $REGISTRY/core-api:${{ github.sha }}
        docker push $REGISTRY/core-api:latest

        # 2. AI Worker
        docker build -t $REGISTRY/ai-worker:${{ github.sha }} -t $REGISTRY/ai-worker:latest ./services/ai-worker
        docker push $REGISTRY/ai-worker:${{ github.sha }}
        docker push $REGISTRY/ai-worker:latest

        # 3. Realtime API
        docker build -t $REGISTRY/realtime-api:${{ github.sha }} -t $REGISTRY/realtime-api:latest ./services/realtime-api
        docker push $REGISTRY/realtime-api:${{ github.sha }}
        docker push $REGISTRY/realtime-api:latest
