name: Build and Push Images to GCP Artifact Registry

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: "k8s-cluster-lunching"
  GAR_LOCATION: "europe-west4"
  REPOSITORY: "django-app-repo"

jobs:
  build-and-push:
    name: Build & Push Service Images
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker for GCP Artifact Registry
      run: |
        gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

    - name: Build and Push Images
      run: |
        REGISTRY="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}"

        # 1. Core API (backend)
        docker build -t $REGISTRY/core-api:${{ github.sha }} \
          -f ./services/core-api/Dockerfile.k8s \
          ./services/core-api
        docker push $REGISTRY/core-api:${{ github.sha }}

        # 2. Frontend (React/Vite)
        docker build -t $REGISTRY/frontend:${{ github.sha }} \
          -f ./voice-frontend/Dockerfile.k8s \
          --build-arg VITE_API_URL=https://elaraby.shop/api/v1 \
          ./voice-frontend
        docker push $REGISTRY/frontend:${{ github.sha }}

        # 3. AI Worker (ai_agent)
        docker build -t $REGISTRY/ai-worker:${{ github.sha }} \
          -f ./services/ai-worker/Dockerfile.k8s \
          ./services/ai-worker
        docker push $REGISTRY/ai-worker:${{ github.sha }}

        # 4. Realtime API
        docker build -t $REGISTRY/realtime-api:${{ github.sha }} \
          -f ./services/realtime-api/Dockerfile.k8s \
          ./services/realtime-api
        docker push $REGISTRY/realtime-api:${{ github.sha }}

    - name: Output image tag for reference
      run: echo "Images pushed with tag: ${{ github.sha }}"
