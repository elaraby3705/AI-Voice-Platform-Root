name: Build and Push Images to GCP Artifact Registry

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: "k8s-cluster-lunching"
  GAR_LOCATION: "europe-west4"             # تم التعديل: رمز المنطقة فقط
  REPOSITORY: "django-app-repo"           # تم التعديل: اسم المستودع فقط

jobs:
  build-and-push:
    name: Build & Push Service Images
    runs-on: ubuntu-latest

    steps:
    # 1. سحب الكود من GitHub
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. تسجيل الدخول لـ GCP
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker for GCP Artifact Registry
      run: |
        gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

    # 3. بناء ورفع الصور إلى GCP Artifact Registry
    - name: Build and Push Images
      run: |
        # 1. Core API
        docker build -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/core-api:${{ github.sha }} ./services/core-api
        docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/core-api:${{ github.sha }}

        # 2. AI Worker
        docker build -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/ai-worker:${{ github.sha }} ./services/ai-worker
        docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/ai-worker:${{ github.sha }}

        # 3. Realtime API
        docker build -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/realtime-api:${{ github.sha }} ./services/realtime-api
        docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/realtime-api:${{ github.sha }}
