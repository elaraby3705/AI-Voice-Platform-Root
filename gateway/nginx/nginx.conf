worker_processes auto; # Optimization: use auto to match CPU cores

events {
    worker_connections 2048; # Higher limit for better concurrent handling
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Gzip Compression: Essential for performance in production
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name localhost;

        # ----------------------------------------
        # 1. API Route: Proxy to Django Backend
        # ----------------------------------------
        location /api/v1/ {
            proxy_pass http://ai_voice_backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ----------------------------------------
        # 2. Admin Route: Django Admin Panel
        # ----------------------------------------
        location /admin/ {
            proxy_pass http://ai_voice_backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ----------------------------------------
        # 3. Static Files: Admin Panel Assets
        # ----------------------------------------
        location /static/ {
            proxy_pass http://ai_voice_backend:8000;
        }

        # ----------------------------------------
        # 4. WebSocket Route: Real-time API
        # ----------------------------------------
        location /ws/ {
            proxy_pass http://ai_voice_realtime:8002;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # ----------------------------------------
        # 5. Root Route: Frontend SPA (React)
        # ----------------------------------------
        location / {
            # In production, we serve build files. 
            # If using dev server, we proxy to frontend container.
            proxy_pass http://ai_voice_frontend:5173;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # HMR/WebSocket for Development
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
